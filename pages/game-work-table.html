<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de montagem | PC Building</title>
    <link rel="stylesheet" href="../styles/game.css">
</head>
<body>
    <header><h1>PC BUILDING</h1></header>
    <main>
        <div id="game">
            <section id="inventory">
                <h2>Inventário</h2>
            </section>

            <section id="work-table" aria-label="Mesa de montagem">
                <div id="case">
                    <div class="case-art component-art" data-asset="gabinete">
                        <img src="../assets/components/gabinete.png" alt="Gabinete na mesa de montagem" draggable="false">
                    </div>
                    <div class="drop-zone motherboard-zone" data-accept="placaMae">
                        <span>Placa-mãe</span>
                        <div class="drop-zone cpu-zone" data-accept="processador">
                            <span>Processador</span>
                        </div>
                        <div class="drop-zone ram-zone" data-accept="ram">
                            <span>Memória RAM</span>
                        </div>
                        <div class="drop-zone video-card-zone" data-accept="placaDeVideo">
                            <span>Placa de Vídeo</span>
                        </div>
                    </div>
                    <div class="drop-zone storage-zone" data-accept="armazenamento">
                        <span>HD / SSD</span>
                    </div>
                    <div class="drop-zone power-supply-zone" data-accept="fonte">
                        <span>Fonte</span>
                    </div>
                </div>
                <section id="actions">
                    <h2>Ações</h2>
                    <button id="turn-on">Ligar PC</button>
                    <button id="reset">Reiniciar</button>
                    <div id="feedback" role="status" aria-live="polite"></div>
                </section>
            </section>
        </div>
    </main>

    <section id="completion-screen" class="completion-screen" aria-hidden="true" hidden>
        <div class="completion-dialog" role="dialog" aria-modal="true" aria-label="Montagem concluída">
            <video id="completion-video" playsinline preload="metadata" disablepictureinpicture>
                <source src="../assets/videos/montagem-concluida.mp4" type="video/mp4">
                Seu navegador não suporta a reprodução deste vídeo.
            </video>
            <button id="close-completion" type="button">Voltar para a bancada</button>
        </div>
    </section>

    <script src="../scripts/game.js"></script>
</body>
</html>

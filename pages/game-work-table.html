<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Table</title>
    <link rel="stylesheet" href="../styles/game.css">
</head>
<body>
    <header><h1>PC BUILDING</h1></header>
    <main>
        <div id="game">
            <section id="inventory">
                <h2>Inventário</h2>
            </section>

            <section id="work-table">
                Área de Trabalho

                <div class="drop-zone" data-accept="placaMae">
                    <span>Placa Mãe</span>
                </div>

                <div class="drop-zone" data-accept="processador">
                    <span>Processador</span>
                </div>

                <div class="drop-zone" data-accept="ram">
                    <span>Memória RAM</span>
                </div>

                <div class="drop-zone" data-accept="placaDeVideo">
                    <span>Placa de Vídeo</span>
                </div>

                <div class="drop-zone" data-accept="armazenamento">
                    <span>Armazenamento</span>
                </div>

                <div class="drop-zone" data-accept="fonte">
                    <span>Fonte</span>
                </div>

            </section>

            <section id="actions">
                <h2>Actions</h2>
                <button id="turn-on">Ligar PC</button>
            </section>
        </div>
    </main>

    <script src="../scripts/game.js"></script>

</body>
</html>
